[workspace]
members = ["api/client", "crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[package]
name = "nrz"
version = "0.49.8"
edition = "2024"
rust-version.workspace = true
description = "ONREZA platform CLI — dev, build, deploy"
license = "MIT"

[lib]
name = "nrz"
path = "src/lib.rs"

[[bin]]
name = "nrz"
path = "src/main.rs"

[dependencies]
tempfile = "3"
nrz-api = { path = "api/client" }
# Public runtime, artifact and publication libraries shared with platform services.
nrz-contract = { path = "crates/nrz-contract" }
nrz-runtime-artifact = { path = "crates/nrz-runtime-artifact" }
nrz-source-bundle = { path = "crates/nrz-source-bundle" }
nrz-source-publisher = { path = "crates/nrz-source-publisher" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server (emulator)
axum = "0.8"

# HTTP client (deploy, API calls)
# reqwest 0.13 uses rustls by default — no native-tls/OpenSSL dependency
reqwest = { version = "0.13", features = ["json", "stream"] }

# Verify signed immutable ONREZA Functions runtime manifests.
ed25519-dalek = { version = "3.0", features = ["pem"] }

# PostgreSQL client (local `nrz db query/schema` execution)
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["native-certs", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Colors / UI
console = "0.16"
indicatif = "0.18"

# Browser open (device flow)
open = "5"

# Archive (upgrade — self-update extraction)
flate2 = "1"
tar = "0.4"

# Parallel uploads (deploy)
futures = "0.3"

# Hashing (synthetic commit SHA, SOURCE_BUNDLE_V1 content/address planning)
sha2 = "0.11"
blake3 = "1"

# Base64 (encoding SHA-256 for `x-amz-checksum-sha256` PUT header)
base64 = "0.23"

# Compression (tar.zst bundle for PROCESS deployments)
zstd = "0.14"

# URL encoding
percent-encoding = "2"

# Config (onreza.toml + onreza.rules.toml authoring → JSON transport)
toml = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
pep508_rs = "0.9.2"

anyhow = "1"

# URL handling (file:// URLs for NODE_OPTIONS)
url = "2"

# Operation/idempotency identifiers for the SOURCE_BUNDLE_V1 upload contract
uuid = { version = "1", features = ["v5", "v7"] }

# Unix signals (graceful shutdown)
libc = "0.2"

# Wheel member qualification and Windows uv archive extraction
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
# HTTP client for integration tests
reqwest = { version = "0.13", features = ["json"] }

[profile.dev.package.sha2]
# Keep large artifact verification fast in dev and inherited test builds.
opt-level = 3

[profile.dev.package.serde-saphyr]
# Keep bounded YAML recursion within the normal test and worker thread stack.
opt-level = 1

[profile.release]
# Fast release builds with minimal size/perf trade-off
# - thin LTO: ~2-3x faster than full LTO, ~5-10% larger binary
# - codegen-units=4: parallel code generation
lto = "thin"
codegen-units = 4
strip = true

# Maximum optimization profile for production releases (slower build)
# Use: cargo build --profile=optimized
[profile.optimized]
inherits = "release"
lto = true
codegen-units = 1

# Keep the blob adapter on the same reviewed private transport implementation.
[patch.crates-io]
bao-tree = { git = "https://github.com/ONREZA/bao-tree", rev = "6f2eedded654982680ef7a739c1affcdf6b5d160" }
iroh-tickets = { git = "https://github.com/ONREZA/iroh-tickets", rev = "0aa7ba6987c6f5ecb7221946c445d5d71354b5ab" }
iroh = { git = "https://github.com/ONREZA/iroh", rev = "504139691888cab2c8ff0128fbc565a262fc7018" }
iroh-base = { git = "https://github.com/ONREZA/iroh", rev = "504139691888cab2c8ff0128fbc565a262fc7018" }
iroh-relay = { git = "https://github.com/ONREZA/iroh", rev = "504139691888cab2c8ff0128fbc565a262fc7018" }
iroh-dns = { git = "https://github.com/ONREZA/iroh", rev = "504139691888cab2c8ff0128fbc565a262fc7018" }
