[package]
name = "nrz"
version = "0.8.1"
edition = "2024"
description = "ONREZA platform CLI — dev, build, deploy"
license = "MIT"

[lib]
name = "nrz"
path = "src/lib.rs"

[[bin]]
name = "nrz"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Emulator: D1-compatible SQLite
rusqlite = { version = "0.38", features = ["bundled"] }

# HTTP server (emulator)
axum = "0.8"

# HTTP client (deploy, API calls)
reqwest = { version = "0.13", features = ["json"] }

# Colors / UI
console = "0.16"
indicatif = "0.18"

# Browser open (device flow)
open = "5"

# Archive (upgrade — self-update extraction)
flate2 = "1"
tar = "0.4"

# Parallel uploads (deploy)
futures = "0.3"

# Hashing (synthetic commit SHA)
sha2 = "0.10"

# URL encoding
percent-encoding = "2"

# Config
toml = "0.8"

# Errors
thiserror = "2"
anyhow = "1"

# URL handling (file:// URLs for NODE_OPTIONS)
url = "2"

# Unix signals (graceful shutdown)
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# HTTP client for integration tests
reqwest = { version = "0.13", features = ["json"] }

[profile.release]
# Fast release builds with minimal size/perf trade-off
# - thin LTO: ~2-3x faster than full LTO, ~5-10% larger binary
# - codegen-units=4: parallel code generation
lto = "thin"
codegen-units = 4
strip = true

# Maximum optimization profile for production releases (slower build)
# Use: cargo build --profile=optimized
[profile.optimized]
inherits = "release"
lto = true
codegen-units = 1
