name: Mutation tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '4'
  TMPDIR: /var/tmp
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  mutants:
    name: Mutation gate
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Mutate the tested PR head so --in-diff refers to exact source lines.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          auto-setup: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build the PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > /tmp/mutants.diff
      - name: Test mutations in changed lines
        if: github.event_name == 'pull_request'
        run: proto run moon -- run workspace:mutants-diff -- /tmp/mutants.diff
      - name: Test all workspace mutations
        if: github.event_name == 'workflow_dispatch'
        run: proto run moon -- run workspace:mutants
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: .cache/mutants.out/
          include-hidden-files: true
          if-no-files-found: ignore
