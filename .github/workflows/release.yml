name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: stable
        options:
          - stable
          - beta
      bump:
        description: Version bump when version is not provided
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: Explicit version, for example 0.33.0 or 0.33.0-beta.0
        type: string
        required: false
      publish_npm:
        description: Publish npm package after GitHub assets are finalized
        type: boolean
        required: true
        default: true
      hold_draft:
        description: Verify assets in a draft without exposing GitHub latest or npm
        type: boolean
        required: true
        default: false
      resume_version:
        description: Finalize existing verified assets without preparing or rebuilding
        type: string
        required: false
      expected_tag_revision:
        description: Exact release commit SHA required when resuming
        type: string
        required: false
      expected_checksums_sha256:
        description: SHA256 of checksums-sha256.txt recorded when assets were held
        type: string
        required: false
      npm_tag_version:
        description: Only move the selected npm channel to this already published version
        type: string
        required: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RELEASE_HOLD_DRAFT: ${{ inputs.hold_draft }}
  RELEASE_RESUME_VERSION: ${{ inputs.resume_version }}
  RELEASE_EXPECTED_REVISION: ${{ inputs.expected_tag_revision }}
  RELEASE_EXPECTED_CHECKSUMS_SHA256: ${{ inputs.expected_checksums_sha256 }}
  RELEASE_RETAG_VERSION: ${{ inputs.npm_tag_version }}
  RELEASE_EXPLICIT_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag:
    name: Update npm channel
    if: inputs.npm_tag_version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release mode
        run: bash .github/scripts/validate-release-mode.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm with trusted dist-tag support
        run: npm install --global npm@12.2.1
      - name: Select published version and verify channel
        run: |
          if [[ "$CHANNEL" == stable ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag=latest
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
            tag=beta
          fi
          npm dist-tag add "@onreza/nrz@$VERSION" "$tag"
          test "$(npm view "@onreza/nrz@$tag" version)" = "$VERSION"
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.npm_tag_version }}
  prepare:
    name: Prepare release
    if: inputs.npm_tag_version == '' && inputs.resume_version == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      npm_dist_tag: ${{ steps.metadata.outputs.npm_dist_tag }}
      release_revision: ${{ steps.commit.outputs.release_revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release mode
        run: bash .github/scripts/validate-release-mode.sh

      - name: Install Dagger CLI
        run: sh .github/scripts/install-dagger.sh

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Node.js for host Git metadata
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'

      - name: Capture Git metadata from the selected checkout
        run: node .dagger/scripts/capture-git-metadata.ts

      - name: Apply release metadata
        run: |
          dagger call prepare-release \
            --source=. \
            --git-metadata=.nrz-release/git.json \
            --channel="$RELEASE_CHANNEL" \
            --version="$RELEASE_VERSION" \
            --bump="$RELEASE_BUMP" \
            export --path . --wipe=false
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump }}

      - name: Read release metadata
        id: metadata
        run: |
          VERSION="$(jq -r '.version' .nrz-release/metadata.json)"
          TAG="$(jq -r '.tag' .nrz-release/metadata.json)"
          CHANNEL="$(jq -r '.channel' .nrz-release/metadata.json)"
          PRERELEASE="$(jq -r '.prerelease' .nrz-release/metadata.json)"
          NPM_DIST_TAG="$(jq -r '.npmDistTag' .nrz-release/metadata.json)"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "npm_dist_tag=$NPM_DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        id: commit
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No release file changes were produced"
            exit 1
          fi
          git commit -m "chore(release): $RELEASE_TAG [skip ci]"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$RELEASE_TAG"
          RELEASE_REVISION="$(git rev-parse HEAD)"
          jq --arg revision "$RELEASE_REVISION" ' . + {releaseRevision: $revision}' .nrz-release/metadata.json > .nrz-release/metadata.tmp
          mv .nrz-release/metadata.tmp .nrz-release/metadata.json
          echo "release_revision=$RELEASE_REVISION" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}

      - name: Upload release provenance
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nrz-release-provenance
          path: .nrz-release/metadata.json
          include-hidden-files: true

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            binary: nrz
          - platform: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: nrz
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: nrz
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nrz.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nrz-bin-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  publish:
    name: Publish
    needs: [prepare, build]
    if: always() && inputs.npm_tag_version == '' && ((needs.prepare.result == 'success' && needs.build.result == 'success') || inputs.resume_version != '')
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version || inputs.resume_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || format('v{0}', inputs.resume_version) }}
      RELEASE_EXPECTED_REVISION: ${{ needs.prepare.outputs.release_revision || inputs.expected_tag_revision }}
      NPM_DIST_TAG: ${{ inputs.channel == 'stable' && 'latest' || 'beta' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify selected release identity
        run: |
          bash .github/scripts/validate-release-mode.sh
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_REVISION"
          echo "RELEASE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_REVISION=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Install Dagger CLI
        run: sh .github/scripts/install-dagger.sh

      - name: Download all artifacts
        if: inputs.resume_version == ''
        uses: actions/download-artifact@v8.0.2
        with:
          path: ./dist/raw

      - name: Package release archives
        if: inputs.resume_version == ''
        run: |
          dagger call package-release-artifacts \
            --binaries=./dist/raw \
            --notices=./THIRD_PARTY_NOTICES \
            --license=./LICENSE \
            export --path ./dist/release --wipe=true
          cp ./dist/raw/nrz-release-provenance/metadata.json ./dist/release/release-metadata.json

      - name: Attest release archives
        if: inputs.resume_version == ''
        uses: actions/attest@v4.2.2
        with:
          subject-path: ./dist/release/*.tar.gz

      - name: Download existing release assets
        if: inputs.resume_version != ''
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir ./dist/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        run: |
          dagger call publish-github-release \
            --source=. \
            --artifacts=./dist/release \
            --github-token=env:GITHUB_TOKEN \
            --version="$RELEASE_VERSION" \
            --tag="$RELEASE_TAG" \
            --channel="$RELEASE_CHANNEL" \
            --repository="$GITHUB_REPOSITORY" \
            --hold-draft="$RELEASE_HOLD_DRAFT" \
            --resume-existing="${{ inputs.resume_version != '' }}" \
            --release-revision="$RELEASE_REVISION" \
            --source-revision="$RELEASE_SOURCE_REVISION" \
            --expected-checksums-sha256="$RELEASE_EXPECTED_CHECKSUMS_SHA256"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: inputs.publish_npm && !inputs.hold_draft
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        if: inputs.publish_npm && !inputs.hold_draft
        run: npm install --global npm@12.2.1

      - name: Generate npm package
        if: inputs.publish_npm && !inputs.hold_draft
        run: |
          dagger call npm-package \
            --source=. \
            --artifacts=./dist/release \
            --version="$RELEASE_VERSION" \
            --tag="$RELEASE_TAG" \
            --channel="$RELEASE_CHANNEL" \
            export --path ./dist/npm --wipe=true
      - name: Publish npm package
        if: inputs.publish_npm && !inputs.hold_draft
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        working-directory: ./dist/npm
