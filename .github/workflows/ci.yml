name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '4'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install repository Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          auto-setup: true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .moon/cache
            .cache/tools/oas3-gen
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/*.yml', 'moon.yml', 'Cargo.lock', 'bun.lock', 'api/generator.lock.json') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/*.yml', 'moon.yml', 'Cargo.lock', 'bun.lock', 'api/generator.lock.json') }}-

      - name: Run quality gate
        run: proto run moon -- run workspace:check

      - name: Upload duplicate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duplicate-report
          path: .jscpd/
          include-hidden-files: true
          if-no-files-found: ignore

  musl-build:
    name: Build Linux musl
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        run: rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

  # Check commit messages on PR
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check commits
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --ignore-merge-commits
