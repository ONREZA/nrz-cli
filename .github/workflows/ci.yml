name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run tests on every push/PR
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Dagger CLI
        run: |
          DAGGER_VERSION="$(jq -r '.engineVersion | sub("^v"; "")' dagger.json)"
          DAGGER_BIN_DIR="$RUNNER_TEMP/dagger"
          mkdir -p "$DAGGER_BIN_DIR"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$DAGGER_BIN_DIR" DAGGER_VERSION="$DAGGER_VERSION" sh
          echo "$DAGGER_BIN_DIR" >> "$GITHUB_PATH"
          "$DAGGER_BIN_DIR/dagger" version

      - name: Run Dagger CI
        run: dagger call ci --source=.

  # Check commit messages on PR
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --ignore-merge-commits
