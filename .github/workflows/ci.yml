name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '4'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          auto-setup: true

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .moon/cache
            .cache/tools/oas3-gen
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/*.yml', 'moon.yml', 'Cargo.lock', 'bun.lock', 'api/generator.lock.json') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/*.yml', 'moon.yml', 'Cargo.lock', 'bun.lock', 'api/generator.lock.json') }}-

      - name: Run quality gate
        run: proto run moon -- run workspace:check

      - name: Upload duplicate report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: duplicate-report
          path: .jscpd/
          include-hidden-files: true
          if-no-files-found: ignore

  musl-build:
    name: Build Linux musl
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

  # Check commit messages on PR
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --ignore-merge-commits
