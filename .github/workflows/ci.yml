name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run tests on every push/PR
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Dagger CLI
        run: |
          DAGGER_VERSION="$(jq -r '.engineVersion | sub("^v"; "")' dagger.json)"
          DAGGER_BIN_DIR="$RUNNER_TEMP/dagger"
          mkdir -p "$DAGGER_BIN_DIR"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$DAGGER_BIN_DIR" DAGGER_VERSION="$DAGGER_VERSION" sh
          echo "$DAGGER_BIN_DIR" >> "$GITHUB_PATH"
          "$DAGGER_BIN_DIR/dagger" version

      - name: Run Dagger CI
        run: dagger call ci --source=.

  # Lint commit messages on PR
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
