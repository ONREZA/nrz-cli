[package]
name = "nrz-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ONREZA platform client generated from the server OpenAPI contract"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
http = "1"
oas3-gen-support = "=0.28.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "http2", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["base64", "chrono"] }
uuid = { version = "1", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
