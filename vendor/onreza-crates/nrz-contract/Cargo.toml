[package]
name = "nrz-contract"
version = "0.33.0"
edition = "2024"
license = "MIT"
description = "Generated ONREZA platform contract types used by nrz CLI binary builds"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
regress = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
