[package]
name = "nrz-fn-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ONREZA Functions source declaration analyzer used by nrz CLI binary builds"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_allocator = "0.142"
oxc_ast = "0.142"
oxc_ast_visit = "0.142"
oxc_parser = "0.142"
oxc_semantic = "0.142"
oxc_span = "0.142"
