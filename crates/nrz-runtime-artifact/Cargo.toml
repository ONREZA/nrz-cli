[package]
name = "nrz-runtime-artifact"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared runtime artifact graph identity used by nrz CLI binary builds"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
hex = "0.4"
goblin = "0.10.7"
nrz-contract = { path = "../nrz-contract" }
nrz-source-bundle = { path = "../nrz-source-bundle" }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
