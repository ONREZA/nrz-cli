[package]
name = "nrz-source-publisher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Source V2 transfer provider used by nrz CLI binary builds"

[dependencies]
tempfile = "3"
iroh = { git = "https://github.com/ONREZA/iroh", rev = "504139691888cab2c8ff0128fbc565a262fc7018", default-features = false, features = ["tls-ring"] }
iroh-blobs = { git = "https://github.com/ONREZA/iroh-blobs", rev = "8676c05036e7983b5aeb4a711917d2ec4a93565f", default-features = false }
bao-tree = { version = "0.17", default-features = false, features = ["fs", "validate"] }
anyhow = "1"
bytes = "1"
hex = "0.4"
libc = "0.2"
nrz-contract = { path = "../nrz-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "sync", "macros"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
