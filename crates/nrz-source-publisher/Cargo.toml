[package]
name = "nrz-source-publisher"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Source V2 transfer provider used by nrz CLI binary builds"

[[example]]
name = "qualify_source_transfer"
test = true

[dependencies]
tempfile = "3"
iroh = { git = "https://github.com/ONREZA/iroh", rev = "f24a5bf33ecceee3083e4dbb8f256e3d4db70be3", default-features = false, features = ["tls-ring"] }
iroh-blobs = { git = "https://github.com/ONREZA/iroh-blobs", rev = "8bcf246d6b2f47a71115b1115d0abc2140b26b37", default-features = false }
bao-tree = { version = "0.17", default-features = false, features = ["fs", "validate"] }
anyhow = "1"
bytes = "1"
nrz-contract = { path = "../nrz-contract" }
nrz-runtime-artifact = { path = "../nrz-runtime-artifact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "sync", "macros"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
