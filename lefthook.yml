# Lefthook configuration
# https://github.com/evilmartians/lefthook

commit-msg:
  commands:
    cocogitto:
      run: proto run moon -- run workspace:commits-verify -- {1}
      fail_text: |
        Commit message does not follow Conventional Commits format.

        Format: <type>(<scope>): <subject>
        Allowed types and scopes are defined in cog.toml.

pre-commit:
  parallel: false
  commands:
    check:
      run: proto run moon -- run workspace:verify-commit

pre-push:
  parallel: false
  commands:
    check:
      run: proto run moon -- run workspace:check
