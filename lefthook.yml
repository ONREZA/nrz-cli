# Lefthook configuration
# https://github.com/evilmartians/lefthook

commit-msg:
  commands:
    cocogitto:
      run: cog verify --file {1}
      fail_text: |
        Commit message does not follow Conventional Commits format.

        Format: <type>(<scope>): <subject>
        Allowed types and scopes are defined in cog.toml.

pre-commit:
  parallel: false
  commands:
    fmt:
      run: cargo fmt -- {staged_files}
      glob: "**/*.rs"
      stage_fixed: true
    clippy:
      run: cargo clippy -- -D warnings
      glob: "**/*.rs"

pre-push:
  parallel: false
  commands:
    test:
      run: cargo test
      glob: "*.rs"
